[project]
name = "personal-finance-manager-backend"
version = "0.1.0"
description = "AI Personal Finance Manager (India) - Backend Foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "psycopg[binary]>=3.1.18",
    "argon2-cffi>=23.1.0",
    "email-validator>=2.0.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.9",
    "pymupdf>=1.25.0",
    "opencv-python-headless>=4.10.0",
    "pillow>=11.0.0",
    "rapidocr>=2.0.0",
    "onnxruntime>=1.20.0",
    "cryptography>=44.0.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.150.0",
    "scikit-learn>=1.6.0",
    "groq>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
